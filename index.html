<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#173f3a" />
  <title>家序 · 看见未来的家</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="customer-language.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><img class="brand-logo" src="shangpinju-mark.jpg" alt="尚品居原创家具" /><span>家序 <small>先看见生活，再决定家具</small></span></div>
    <div class="demo"><span></span> 免费体验 · 没有标准答案</div>
  </header>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="progress-copy"><span id="progress-label"></span><strong id="progress-percent"></strong></div>
      <div class="progress"><i id="progress-bar"></i></div>
      <nav id="step-nav" aria-label="体验流程"></nav>
      <div class="advisor"><span>有问题随时叫我们</span><strong>尚品居原创家具 · 揭阳揭东</strong><small>我们只建议真正需要的东西</small></div>
    </aside>
    <main id="main" tabindex="-1"></main>
    <aside class="live-summary" id="summary"></aside>
  </div>
  <div class="mobile-progress"><button id="mobile-steps" aria-label="查看流程">☰</button><span id="mobile-title"></span><b id="mobile-percent"></b></div>
  <script type="module" src="app.js"></script>
</body>
</html>
